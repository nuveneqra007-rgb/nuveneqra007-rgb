<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" width="100%" height="180">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#D4D4D4" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>
    <style>
      .ascii-text {
        font-family: "Courier New", Consolas, "Liberation Mono", monospace;
        font-weight: 900;
        fill: url(#cyberGrad);
        letter-spacing: 1px;
      }
      .hud-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        fill: #666666;
        letter-spacing: 2px;
      }
      .hud-val {
        fill: #A3A3A3;
        font-weight: bold;
      }
      .scan-line {
        animation: scanMove 4s ease-in-out infinite;
      }
      @keyframes scanMove {
        0%, 100% { transform: translateY(0); opacity: 0.15; }
        50% { transform: translateY(160px); opacity: 0.45; }
      }
      @keyframes textGlow {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4)); }
      }
      .glow-group {
        animation: textGlow 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Panel -->
  <rect x="2" y="2" width="836" height="176" rx="14" fill="#0A0A0A" stroke="#262626" stroke-width="1.5" />

  <!-- Scanning grid background -->
  <line x1="20" y1="36" x2="820" y2="36" stroke="#1A1A1A" stroke-width="1" />
  <line x1="20" y1="148" x2="820" y2="148" stroke="#1A1A1A" stroke-width="1" />

  <!-- HUD Header -->
  <g class="hud-text">
    <circle cx="28" cy="22" r="3.5" fill="#FFFFFF" />
    <text x="40" y="25">SYSTEM:<tspan class="hud-val"> ONLINE</tspan></text>
    <text x="210" y="25">NODE:<tspan class="hud-val"> SEC_DEV_01</tspan></text>
    <text x="400" y="25">MODE:<tspan class="hud-val"> FULL_STACK // APPSEC</tspan></text>
    <text x="700" y="25">PORT:<tspan class="hud-val"> 0x443</tspan></text>
  </g>

  <!-- ASCII Art "HELLO WORLD" with glowing effect -->
  <g class="glow-group ascii-text" font-size="13">
    <text x="28" y="60">██╗  ██╗███████╗██╗     ██╗      ██████╗     ██╗    ██╗ ██████╗ ██████╗ ██╗     ██████╗ </text>
    <text x="28" y="76">██║  ██║██╔════╝██║     ██║     ██╔═══██╗    ██║    ██║██╔═══██╗██╔══██╗██║     ██╔══██╗</text>
    <text x="28" y="92">███████║█████╗  ██║     ██║     ██║   ██║    ██║ █╗ ██║██║   ██║██████╔╝██║     ██║  ██║</text>
    <text x="28" y="108">██╔══██║██╔══╝  ██║     ██║     ██║   ██║    ██║███╗██║██║   ██║██╔══██╗██║     ██║  ██║</text>
    <text x="28" y="124">██║  ██║███████╗███████╗███████╗╚██████╔╝    ╚███╔███╔╝╚██████╔╝██║  ██║███████╗██████╔╝</text>
    <text x="28" y="140">╚═╝  ╚═╝╚══════╝╚══════╝╚══════╝ ╚═════╝      ╚══╝╚══╝  ╚═════╝ ╚═╝  ╚═╝╚══════╝╚═════╝ </text>
  </g>

  <!-- Laser / Scan Line -->
  <line class="scan-line" x1="10" y1="10" x2="830" y2="10" stroke="#FFFFFF" stroke-width="1" />

  <!-- HUD Footer Status -->
  <g class="hud-text">
    <text x="28" y="165">> READY FOR DEPLOYMENT_</text>
    <text x="645" y="165">HASH: <tspan class="hud-val">e3b0c44298fc1c14</tspan></text>
  </g>
</svg>
