<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 235" width="900" height="235" role="img" aria-label="Alexander López — Full-Stack Developer &amp; AppSec">
  <defs>
    <!-- Vibrant emerald waving palette harmonized with capsule-render footer (050706 -> 141A16 -> 004D26) -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050706"/>
      <stop offset="48%" stop-color="#141A16"/>
      <stop offset="100%" stop-color="#005E2E"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="80%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#004D26" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#00B85C" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#004D26" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="waveRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004D26" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00E676" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#004D26" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8DF25A"/>
      <stop offset="100%" stop-color="#48D456"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF80" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#00E676" stop-opacity="0.16"/>
      <stop offset="75%" stop-color="#006633" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#004D26" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbShellFill" cx="50%" cy="48%" r="54%">
      <stop offset="0%" stop-color="#0A3B24" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#052114" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0.22"/>
    </radialGradient>
    <filter id="neonBloom" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="eyeBloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="heroWaveClip">
      <path d="M 0,16 Q 0,0 16,0 L 884,0 Q 900,0 900,16 L 900,184 C 745,232 585,154 420,192 C 245,232 108,176 0,204 Z"/>
    </clipPath>
    <style>
      .kicker {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.6px;
        fill: #A7BEB0;
      }
      .tagline {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 17px;
        font-weight: 400;
        fill: #F2F7F4;
        letter-spacing: 0.2px;
      }
      .submeta {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 12.5px;
        fill: #96B3A2;
      }
      @keyframes floatOrb {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes shadowPulse {
        0%, 100% { transform: scaleX(1); opacity: 0.45; }
        50% { transform: scaleX(0.8); opacity: 0.2; }
      }
      @keyframes auraPulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes corePulse {
        0%, 100% { opacity: 0.92; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes nodeBlink {
        0%, 100% { opacity: 0.22; transform: scale(0.75); }
        45%, 55% { opacity: 1; transform: scale(1.25); }
      }
      @keyframes waveDrift {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(-20px); }
      }
      .orb-wrap {
        animation: floatOrb 3.4s ease-in-out infinite;
      }
      .orb-aura {
        transform-origin: 765px 100px;
        animation: auraPulse 3.4s ease-in-out infinite;
      }
      .shadow-wrap {
        transform-origin: 765px 175px;
        animation: shadowPulse 3.4s ease-in-out infinite;
      }
      .eye-core {
        transform-origin: 0px 0px;
        animation: corePulse 2.6s ease-in-out infinite;
      }
      .node-a { animation: nodeBlink 2.2s ease-in-out infinite; }
      .node-b { animation: nodeBlink 2.2s ease-in-out 0.7s infinite; }
      .node-c { animation: nodeBlink 2.2s ease-in-out 1.4s infinite; }
      .node-d { animation: nodeBlink 2.6s ease-in-out 0.35s infinite; }
      .wave-accent {
        animation: waveDrift 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Main vibrant waving canvas -->
  <g clip-path="url(#heroWaveClip)">
    <rect x="0" y="0" width="900" height="235" fill="url(#waveGrad1)"/>
    <path class="wave-accent" d="M -30,122 C 165,68 365,175 565,112 C 725,62 845,128 940,92 L 940,235 L -30,235 Z" fill="url(#waveGrad2)"/>
    <path d="M 0,158 C 210,200 435,122 665,162 C 785,184 855,152 900,142 L 900,235 L 0,235 Z" fill="#004D26" opacity="0.42"/>
  </g>
  <!-- Crisp luminous wave rim -->
  <path d="M 0,204 C 108,176 245,232 420,192 C 585,154 745,232 900,184" fill="none" stroke="url(#waveRim)" stroke-width="1.5"/>

  <!-- Volumetric glow centered behind the AppSec 3D orb -->
  <g class="orb-aura">
    <circle cx="765" cy="100" r="88" fill="url(#orbGlow)"/>
  </g>

  <!-- Left: Human greeting + Hackbit-inspired Alexander López + crisp tagline -->
  <text x="48" y="42" class="kicker">Hola 👋 soy</text>

  <g transform="translate(48, 58) scale(0.56)" fill="url(#wordGrad)">
    <path transform="translate(0,0)" fill-rule="evenodd" d="M22,0 L54,0 L74,96 L48,96 L44,74 L30,74 L26,96 L0,96 Z M34,26 L42,26 L44,52 L32,52 Z"/>
    <path transform="translate(82,0)" fill-rule="evenodd" d="M2,0 L25,2 L23,96 L2,94 Z"/>
    <path transform="translate(114,0)" fill-rule="evenodd" d="M6,24 L56,22 L62,62 L26,64 L26,74 L60,71 L58,94 L6,96 L2,62 Z M25,38 L41,38 L41,49 L25,49 Z"/>
    <path transform="translate(182,0)" fill-rule="evenodd" d="M2,24 L26,22 L33,44 L42,22 L62,24 L46,58 L63,96 L40,96 L31,72 L21,96 L0,94 L18,58 Z"/>
    <path transform="translate(250,0)" fill-rule="evenodd" d="M8,24 L56,22 L62,96 L4,96 L2,56 L38,52 L38,42 L8,44 Z M22,67 L38,66 L38,79 L22,79 Z"/>
    <path transform="translate(318,0)" fill-rule="evenodd" d="M2,24 L24,22 L24,30 L56,23 L62,96 L38,96 L36,46 L24,48 L24,96 L2,96 Z"/>
    <path transform="translate(386,0)" fill-rule="evenodd" d="M38,0 L62,2 L62,96 L6,96 L2,28 L38,24 Z M24,48 L38,47 L38,75 L24,75 Z"/>
    <path transform="translate(456,0)" fill-rule="evenodd" d="M6,24 L56,22 L62,62 L26,64 L26,74 L60,71 L58,94 L6,96 L2,62 Z M25,38 L41,38 L41,49 L25,49 Z"/>
    <path transform="translate(524,0)" fill-rule="evenodd" d="M2,24 L24,22 L24,32 L48,22 L46,48 L26,48 L24,96 L2,96 Z"/>
    <path transform="translate(602,0)" fill-rule="evenodd" d="M2,0 L28,2 L26,72 L56,70 L54,96 L2,96 Z"/>
    <path transform="translate(664,0)" fill-rule="evenodd" d="M6,24 L58,22 L64,94 L4,96 Z M24,45 L40,44 L42,74 L24,75 Z"/>
    <path transform="translate(734,0)" fill-rule="evenodd" d="M2,24 L58,22 L62,92 L26,95 L26,112 L2,114 Z M25,44 L40,44 L40,72 L25,72 Z"/>
    <path transform="translate(804,0)" fill-rule="evenodd" d="M6,24 L56,22 L62,62 L26,64 L26,74 L60,71 L58,94 L6,96 L2,62 Z M25,38 L41,38 L41,49 L25,49 Z"/>
    <path transform="translate(872,0)" fill-rule="evenodd" d="M4,24 L56,22 L58,44 L32,74 L58,72 L56,96 L2,96 L0,74 L26,45 L4,46 Z"/>

  <g transform="translate(686, -10)">
    <path d="M6,0 L34,-4 L26,18 L0,20 Z" fill="#E85335"/>
    <path d="M8,6 L28,3 M6,12 L25,9" stroke="#0D1510" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  </g>

  </g>

  <text x="48" y="148" class="tagline">Construyendo en la web con seguridad y estilo.</text>
  <text x="48" y="171" class="submeta">República Dominicana · Full-Stack, AppSec &amp; Web 3D</text>

  <!-- Right: Floating AppSec 3D Polygonal Orb with Scanner Eye & Orbital Nodes -->
  <g class="shadow-wrap">
    <ellipse cx="765" cy="175" rx="34" ry="5.5" fill="#001A0D"/>
  </g>
  <g class="orb-wrap">
    <g transform="translate(765, 100)">
      <!-- Back orbital arcs (behind orb shell) -->
      <g transform="rotate(-20)" fill="none" stroke="#2BFF88" stroke-width="0.95" stroke-opacity="0.45">
        <path d="M -86,0 A 86,24 0 0,1 86,0"/>
      </g>
      <g transform="rotate(20)" fill="none" stroke="#2BFF88" stroke-width="0.95" stroke-opacity="0.45">
        <path d="M -86,0 A 86,24 0 0,1 86,0"/>
      </g>

      <!-- Translucent polygonal sphere shell -->
      <polygon points="0.0,-60.0 30.0,-51.96 51.96,-30.0 60.0,0.0 51.96,30.0 30.0,51.96 0.0,60.0 -30.0,51.96 -51.96,30.0 -60.0,0.0 -51.96,-30.0 -30.0,-51.96" fill="url(#orbShellFill)"/>

      <!-- Back-hemisphere ghost wireframe for 3D depth -->
      <path d="M0.0,-45.5 L22.75,39.4 M0.0,-36.5 L51.96,-30.0 M22.75,-39.4 L0.0,45.5 M18.25,-31.61 L60.0,0.0 M39.4,-22.75 L-22.75,39.4 M31.61,-18.25 L51.96,30.0 M45.5,0.0 L-39.4,22.75 M36.5,0.0 L30.0,51.96 M39.4,22.75 L-45.5,0.0 M31.61,18.25 L0.0,60.0 M22.75,39.4 L-39.4,-22.75 M18.25,31.61 L-30.0,51.96 M0.0,45.5 L-22.75,-39.4 M0.0,36.5 L-51.96,30.0 M-22.75,39.4 L0.0,-45.5 M-18.25,31.61 L-60.0,0.0 M-39.4,22.75 L22.75,-39.4 M-31.61,18.25 L-51.96,-30.0 M-45.5,0.0 L39.4,-22.75 M-36.5,0.0 L-30.0,-51.96 M-39.4,-22.75 L45.5,0.0 M-31.61,-18.25 L0.0,-60.0 M-22.75,-39.4 L39.4,22.75 M-18.25,-31.61 L30.0,-51.96" fill="none" stroke="#00FF80" stroke-width="0.65" stroke-opacity="0.22"/>

      <!-- Main neon green geodesic wireframe mesh -->
      <g filter="url(#neonBloom)">
        <path d="M0.0,-60.0 L30.0,-51.96 M0.0,-45.5 L22.75,-39.4 M0.0,-60.0 L22.75,-39.4 M0.0,-60.0 L-22.75,-39.4 M0.0,-60.0 L0.0,-45.5 M0.0,-45.5 L0.0,-36.5 M0.0,-36.5 L0.0,-22.0 M0.0,-22.0 L13.0,-19.05 M30.0,-51.96 L51.96,-30.0 M22.75,-39.4 L39.4,-22.75 M30.0,-51.96 L22.75,-39.4 M22.75,-39.4 L18.25,-31.61 M22.75,-39.4 L31.61,-18.25 M22.75,-39.4 L0.0,-36.5 M18.25,-31.61 L13.0,-19.05 M13.0,-19.05 L22.52,-11.0 M51.96,-30.0 L60.0,0.0 M39.4,-22.75 L45.5,0.0 M51.96,-30.0 L45.5,0.0 M51.96,-30.0 L22.75,-39.4 M51.96,-30.0 L39.4,-22.75 M39.4,-22.75 L31.61,-18.25 M31.61,-18.25 L22.52,-11.0 M22.52,-11.0 L26.0,0.0 M60.0,0.0 L51.96,30.0 M45.5,0.0 L39.4,22.75 M60.0,0.0 L45.5,0.0 M45.5,0.0 L36.5,0.0 M45.5,0.0 L31.61,18.25 M45.5,0.0 L31.61,-18.25 M36.5,0.0 L26.0,0.0 M26.0,0.0 L22.52,11.0 M51.96,30.0 L30.0,51.96 M39.4,22.75 L22.75,39.4 M51.96,30.0 L22.75,39.4 M51.96,30.0 L45.5,0.0 M51.96,30.0 L39.4,22.75 M39.4,22.75 L31.61,18.25 M31.61,18.25 L22.52,11.0 M22.52,11.0 L13.0,19.05 M30.0,51.96 L0.0,60.0 M22.75,39.4 L0.0,45.5 M30.0,51.96 L22.75,39.4 M22.75,39.4 L18.25,31.61 M22.75,39.4 L0.0,36.5 M22.75,39.4 L31.61,18.25 M18.25,31.61 L13.0,19.05 M13.0,19.05 L0.0,22.0 M0.0,60.0 L-30.0,51.96 M0.0,45.5 L-22.75,39.4 M0.0,60.0 L-22.75,39.4 M0.0,60.0 L22.75,39.4 M0.0,60.0 L0.0,45.5 M0.0,45.5 L0.0,36.5 M0.0,36.5 L0.0,22.0 M0.0,22.0 L-13.0,19.05 M-30.0,51.96 L-51.96,30.0 M-22.75,39.4 L-39.4,22.75 M-30.0,51.96 L-22.75,39.4 M-22.75,39.4 L-18.25,31.61 M-22.75,39.4 L-31.61,18.25 M-22.75,39.4 L0.0,36.5 M-18.25,31.61 L-13.0,19.05 M-13.0,19.05 L-22.52,11.0 M-51.96,30.0 L-60.0,0.0 M-39.4,22.75 L-45.5,0.0 M-51.96,30.0 L-45.5,0.0 M-51.96,30.0 L-22.75,39.4 M-51.96,30.0 L-39.4,22.75 M-39.4,22.75 L-31.61,18.25 M-31.61,18.25 L-22.52,11.0 M-22.52,11.0 L-26.0,0.0 M-60.0,0.0 L-51.96,-30.0 M-45.5,0.0 L-39.4,-22.75 M-60.0,0.0 L-45.5,0.0 M-45.5,0.0 L-36.5,0.0 M-45.5,0.0 L-31.61,-18.25 M-45.5,0.0 L-31.61,18.25 M-36.5,0.0 L-26.0,0.0 M-26.0,0.0 L-22.52,-11.0 M-51.96,-30.0 L-30.0,-51.96 M-39.4,-22.75 L-22.75,-39.4 M-51.96,-30.0 L-22.75,-39.4 M-51.96,-30.0 L-45.5,0.0 M-51.96,-30.0 L-39.4,-22.75 M-39.4,-22.75 L-31.61,-18.25 M-31.61,-18.25 L-22.52,-11.0 M-22.52,-11.0 L-13.0,-19.05 M-30.0,-51.96 L0.0,-60.0 M-22.75,-39.4 L0.0,-45.5 M-30.0,-51.96 L-22.75,-39.4 M-22.75,-39.4 L-18.25,-31.61 M-22.75,-39.4 L0.0,-36.5 M-22.75,-39.4 L-31.61,-18.25 M-18.25,-31.61 L-13.0,-19.05 M-13.0,-19.05 L0.0,-22.0 M0.0,-60.0 L0.0,-22.0 M0.0,22.0 L0.0,60.0 M60.0,0.0 L26.0,0.0 M-26.0,0.0 L-60.0,0.0" fill="none" stroke="#1BFF85" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Highlighted inner mint-white ring -->
        <path d="M0.0,-36.5 L18.25,-31.61 L31.61,-18.25 L36.5,0.0 L31.61,18.25 L18.25,31.61 L0.0,36.5 L-18.25,31.61 L-31.61,18.25 L-36.5,0.0 L-31.61,-18.25 L-18.25,-31.61 Z" fill="none" stroke="#C8FFE0" stroke-width="1.05" stroke-opacity="0.88" stroke-linejoin="round"/>
      </g>

      <!-- Tiny suspended scanner particles inside orb -->
      <g transform="translate(-18, -14)"><circle r="1.2" fill="#FFFFFF" class="node-b"/></g>
      <g transform="translate(20, -16)"><circle r="1.3" fill="#FFFFFF" class="node-c"/></g>
      <g transform="translate(9, 24)"><circle r="1.1" fill="#A7FFCB" class="node-a"/></g>

      <!-- Bright white geometric scanner eye in core -->
      <g filter="url(#eyeBloom)">
        <g class="eye-core" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
          <!-- Almond eye silhouette -->
          <path d="M -23,0 Q 0,-19 23,0 Q 0,19 -23,0 Z" stroke-width="2.1"/>
          <!-- Crosshairs -->
          <line x1="-21" y1="0" x2="21" y2="0" stroke-width="1.25"/>
          <line x1="0" y1="-12.5" x2="0" y2="12.5" stroke-width="1.25"/>
          <!-- Outer & segmented HUD iris rings -->
          <circle cx="0" cy="0" r="11.2" stroke-width="1.35"/>
          <path d="M -6.2,-4.5 A 7.6,7.6 0 0,1 -4.5,-6.2 M 4.5,-6.2 A 7.6,7.6 0 0,1 6.2,-4.5 M 6.2,4.5 A 7.6,7.6 0 0,1 4.5,6.2 M -4.5,6.2 A 7.6,7.6 0 0,1 -6.2,4.5" stroke-width="1.2"/>
          <!-- Luminous pupil core -->
          <polygon points="0,-4.5 4.5,0 0,4.5 -4.5,0" fill="#FFFFFF" stroke="none"/>
          <circle cx="0" cy="0" r="3" fill="#FFFFFF" stroke="none"/>
        </g>
      </g>

      <!-- Front orbital arcs & intermittent blinking orbital nodes -->
      <g transform="rotate(-20)">
        <path d="M -86,0 A 86,24 0 0,0 86,0" fill="none" stroke="#3BFF95" stroke-width="1.1" stroke-opacity="0.78"/>
        <g transform="translate(-77.94, -10.14)"><circle r="2.3" fill="#FFFFFF" filter="url(#neonBloom)" class="node-a"/></g>
        <g transform="translate(-83.07, 6.21)"><circle r="1.9" fill="#00FF80" filter="url(#neonBloom)" class="node-b"/></g>
        <g transform="translate(-65.88, 15.43)"><circle r="2.1" fill="#FFFFFF" filter="url(#neonBloom)" class="node-c"/></g>
        <g transform="translate(70.45, -13.77)"><circle r="2.2" fill="#00FF80" filter="url(#neonBloom)" class="node-d"/></g>
        <g transform="translate(80.81, 8.21)"><circle r="2.2" fill="#FFFFFF" filter="url(#neonBloom)" class="node-a"/></g>
      </g>
      <g transform="rotate(20)">
        <path d="M -86,0 A 86,24 0 0,0 86,0" fill="none" stroke="#3BFF95" stroke-width="1.1" stroke-opacity="0.78"/>
        <g transform="translate(-77.94, -10.14)"><circle r="2.0" fill="#00FF80" filter="url(#neonBloom)" class="node-c"/></g>
        <g transform="translate(-73.92, 12.26)"><circle r="2.3" fill="#FFFFFF" filter="url(#neonBloom)" class="node-d"/></g>
        <g transform="translate(77.94, -10.14)"><circle r="2.1" fill="#FFFFFF" filter="url(#neonBloom)" class="node-b"/></g>
        <g transform="translate(73.92, 12.26)"><circle r="2.0" fill="#00FF80" filter="url(#neonBloom)" class="node-a"/></g>
        <g transform="translate(65.88, 15.43)"><circle r="1.8" fill="#FFFFFF" filter="url(#neonBloom)" class="node-c"/></g>
      </g>
    </g>
  </g>
</svg>
