<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 20" width="100%" role="img" aria-label="HUD Divider">
  <defs>
    <linearGradient id="pulseBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF66" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="18" y1="10" x2="832" y2="10" stroke="#1F2622" stroke-width="1.5"/>
  <rect x="6" y="7" width="6" height="6" fill="#00FF66" opacity="0.85"/>
  <rect x="838" y="7" width="6" height="6" fill="#6B7280"/>
  <rect x="-120" y="9" width="120" height="2.5" fill="url(#pulseBeam)">
    <animate attributeName="x" from="-120" to="850" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
