  <!-- Panel derecho: Radar giratorio -->
  <g>
    <circle cx="698" cy="106" r="44" fill="none" stroke="#1D2621" stroke-width="1"/>
    <circle cx="698" cy="106" r="28" fill="none" stroke="#2A352F" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="646" y1="106" x2="750" y2="106" stroke="#1A231E" stroke-width="1"/>
    <line x1="698" y1="54" x2="698" y2="158" stroke="#1A231E" stroke-width="1"/>

    <circle cx="698" cy="106" r="40" fill="none" stroke="#00FF66" stroke-width="2" stroke-dasharray="32 22 10 26" opacity="0.9">
