    <text x="108" y="117" fill="#00FF66">▸</text>
    <text x="126" y="117" fill="#F3F4F6">Full-Stack Dev &amp; Cybersecurity Enthusiast</text>

    <text x="24" y="140" fill="#6B7280" font-weight="bold">ORIGIN</text>
    <text x="108" y="140" fill="#00FF66">▸</text>
    <text x="126" y="140" fill="#F3F4F6">República Dominicana [18.73°N, 70.16°W] 🇩🇴</text>

    <text x="24" y="163" fill="#6B7280" font-weight="bold">KERNEL</text>
    <text x="108" y="163" fill="#00FF66">▸</text>
    <text x="126" y="163" fill="#F3F4F6">Next.js 16 · TypeScript · Python · Three.js</text>

    <text x="24" y="186" fill="#6B7280" font-weight="bold">FOCUS</text>
    <text x="108" y="186" fill="#00FF66">▸</text>
    <text x="126" y="186" fill="#F3F4F6">Threat Intel · AppSec · 3D Web Systems</text>

    <text x="24" y="209" fill="#6B7280" font-weight="bold">ARSENAL</text>
    <text x="108" y="209" fill="#00FF66">▸</text>
    <text x="126" y="209" fill="#F3F4F6">React · FastAPI · Node.js · Wireshark · Docker</text>

    <text x="24" y="232" fill="#6B7280" font-weight="bold">FLAGSHIP</text>
    <text x="108" y="232" fill="#00FF66">▸</text>
    <text x="126" y="232" fill="#F3F4F6">SecScanner (Live Threat Intel) · Portafolio 3D</text>

    <text x="24" y="257" fill="#6B7280" font-weight="bold">MINDSET</text>
