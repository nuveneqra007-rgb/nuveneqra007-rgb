  <circle cx="636" cy="18" r="3.5" fill="#00FF66">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="648" y="22" fill="#00FF66" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="bold" letter-spacing="1.5">ONLINE // MISSIONS_READY</text>

  <!-- Prompt de terminal + cursor parpadeante -->
  <text x="24" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <tspan fill="#00FF66" font-weight="bold">alexander@nuveneqra007</tspan><tspan fill="#6B7280">:</tspan><tspan fill="#FFFFFF">~</tspan><tspan fill="#E5E7EB">$ fastfetch --sec-profile</tspan>
  </text>
  <rect x="410" y="48" width="8" height="14" fill="#00FF66">
