  </defs>

  <!-- Chasis principal robusto -->
  <polygon points="16,2 834,2 848,16 848,269 834,283 16,283 2,269 2,16" fill="#050706" stroke="#242B27" stroke-width="1.5"/>
  <polygon points="16,2 834,2 848,16 848,269 834,283 16,283 2,269 2,16" fill="url(#hudGrid)" opacity="0.85"/>

  <!-- Barra superior de cabecera -->
