  <line x1="2" y1="34" x2="848" y2="34" stroke="#1F2822" stroke-width="1"/>

  <!-- Esquinas tácticas verde terminal -->
  <polyline points="2,24 2,16 16,2 30,2" fill="none" stroke="#00FF66" stroke-width="2"/>
  <polyline points="820,2 834,2 848,16 848,24" fill="none" stroke="#00FF66" stroke-width="2"/>
  <polyline points="2,261 2,269 16,283 30,283" fill="none" stroke="#00FF66" stroke-width="2"/>
  <polyline points="820,283 834,283 848,269 848,261" fill="none" stroke="#00FF66" stroke-width="2"/>

