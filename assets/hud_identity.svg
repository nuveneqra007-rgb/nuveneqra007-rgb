    <text x="572" y="214" fill="#8B949E">APPSEC / RECON</text>
    <text x="820" y="214" fill="#00FF66" text-anchor="end">80%</text>
    <rect x="572" y="220" width="248" height="6" rx="1" fill="#121814"/>
    <rect x="572" y="220" width="198" height="6" rx="1" fill="#00FF66">
      <animate attributeName="opacity" values="1;0.65;1" dur="2.1s" repeatCount="indefinite"/>
    </rect>

    <text x="572" y="246" fill="#8B949E">3D / CREATIVE CODE</text>
    <text x="820" y="246" fill="#FFFFFF" text-anchor="end">86%</text>
    <rect x="572" y="252" width="248" height="6" rx="1" fill="#121814"/>
    <rect x="572" y="252" width="213" height="6" rx="1" fill="#D1D5DB">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
