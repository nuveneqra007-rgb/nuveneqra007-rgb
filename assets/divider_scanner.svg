<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="900" height="28" role="img" aria-label="Minimalist Cyber Divider">
  <defs>
    <linearGradient id="laserMinC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0"/>
      <stop offset="16%" stop-color="#2ea043" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#3fb950" stop-opacity="0.82"/>
      <stop offset="48.5%" stop-color="#A8FFCB" stop-opacity="0.92"/>
      <stop offset="49.2%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50.8%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="51.5%" stop-color="#A8FFCB" stop-opacity="0.92"/>
      <stop offset="58%" stop-color="#3fb950" stop-opacity="0.82"/>
      <stop offset="84%" stop-color="#2ea043" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="auraMinC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowMinC" x="-60%" y="-150%" width="220%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes gemBreath {
        0%, 100% { opacity: 0.78; }
        50% { opacity: 1; }
      }
      .min-gem {
        animation: gemBreath 3.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Soft localized center glow -->
  <circle cx="450" cy="14" r="13" fill="url(#auraMinC)"/>

  <!-- Thin fading cyber-laser hairline -->
  <rect x="40" y="13.4" width="820" height="1.2" fill="url(#laserMinC)" filter="url(#glowMinC)"/>

  <!-- Small minimalist hollow geometric diamond (5.5px radius) -->
  <g class="min-gem" filter="url(#glowMinC)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="450,8.5 455.5,14 450,19.5 444.5,14" stroke="#3fb950" stroke-width="1.15"/>
    <polyline points="444.5,14 450,8.5 455.5,14" stroke="#E6FFF0" stroke-width="1.05"/>
  </g>
</svg>
