<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="900" height="28" role="img" aria-label="Minimal Cyber Divider">
  <defs>
    <linearGradient id="minLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0"/>
      <stop offset="18%" stop-color="#2ea043" stop-opacity="0.22"/>
      <stop offset="44%" stop-color="#3fb950" stop-opacity="0.72"/>
      <stop offset="48.4%" stop-color="#3fb950" stop-opacity="0.85"/>
      <stop offset="48.5%" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="51.5%" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="51.6%" stop-color="#3fb950" stop-opacity="0.85"/>
      <stop offset="56%" stop-color="#3fb950" stop-opacity="0.72"/>
      <stop offset="82%" stop-color="#2ea043" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="minGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes minPulse {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      .center-gem {
        animation: minPulse 3.6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Subtle soft glow at center -->
  <circle cx="450" cy="14" r="16" fill="url(#minGlow)"/>

  <!-- Single thin hairline fading line -->
  <rect x="40" y="13.5" width="820" height="1" fill="url(#minLaser)"/>

  <!-- Minimalist center wireframe diamond -->
  <g class="center-gem" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="450,6.5 457.5,14 450,21.5 442.5,14" stroke="#3fb950" stroke-width="1.2"/>
    <circle cx="450" cy="14" r="1.4" fill="#D8FFE6" stroke="none"/>
  </g>
</svg>
