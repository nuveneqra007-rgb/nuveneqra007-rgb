<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="900" height="20" role="img" aria-label="Minimalist Glowing Green Divider">
  <defs>
    <!-- Smooth horizontal fade for the core thin line -->
    <linearGradient id="coreLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0"/>
      <stop offset="15%" stop-color="#2ea043" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#3fb950" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#9EFFBF" stop-opacity="0.98"/>
      <stop offset="65%" stop-color="#3fb950" stop-opacity="0.72"/>
      <stop offset="85%" stop-color="#2ea043" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft emerald aura gradient -->
    <linearGradient id="auraLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0"/>
      <stop offset="20%" stop-color="#2ea043" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.52"/>
      <stop offset="80%" stop-color="#2ea043" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle vertical & horizontal aura blur -->
    <filter id="subtleGreenAura" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.6"/>
    </filter>

    <style>
      @keyframes pulseLine {
        0%, 100% { opacity: 0.42; }
        50% { opacity: 1; }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.85; }
      }
      .thin-core {
        animation: pulseLine 2.8s ease-in-out infinite;
      }
      .thin-aura {
        animation: pulseAura 2.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Subtle green glow aura around the thin line -->
  <rect class="thin-aura" x="45" y="8.4" width="810" height="3.2" rx="1.6" fill="url(#auraLineGrad)" filter="url(#subtleGreenAura)"/>

  <!-- Ultra-thin minimalist blinking green line -->
  <rect class="thin-core" x="45" y="9.55" width="810" height="0.9" fill="url(#coreLineGrad)"/>
</svg>
